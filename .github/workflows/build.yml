name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build (Debug)
        run: dotnet build Pult/Pult.csproj -c Debug

      - name: Build (Release)
        run: dotnet build Pult/Pult.csproj -c Release

      - name: Publish single-file
        run: >
          dotnet publish Pult/Pult.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pult-win-x64
          path: publish/win-x64/Pult.exe
          if-no-files-found: error
